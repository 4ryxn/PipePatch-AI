[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pipepatch-ai-backend"
version = "0.1.0"
description = "PipePatch AI backend service"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "google-genai==2.18.1",
    "numpy==2.5.2",
    "opencv-contrib-python-headless==4.14.0.94",
    "python-multipart==0.0.20",
    "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "mypy==1.15.0",
    "pytest==8.3.5",
    "ruff==0.11.2",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]
